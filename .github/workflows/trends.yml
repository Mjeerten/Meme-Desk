name: record trends
# meme/trends.py: hourly snapshot of Google Trends / Wikipedia / CoinGecko trending, appended on the 'trends' branch.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: trends
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: snapshot onto the trends branch
        run: |
          cp meme/trends.py /tmp/trends.py
          git fetch origin trends && git checkout trends || git checkout --orphan trends
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name trends -exec rm -rf {} +
          python /tmp/trends.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends && git commit -qm "trends $(date -u +%F-%H)" && git push -q origin trends
