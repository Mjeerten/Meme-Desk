name: round 3 exchange memecoins
# meme/bigcoins.py (big memecoins, daily strategies) + meme/listings.py (new Binance perp listings). Public Binance data.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "bigcoins, listings or both"
        default: both
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas numpy requests
      - if: inputs.script != 'listings'
        run: python -m meme.bigcoins --out results
      - if: inputs.script != 'bigcoins'
        run: python -m meme.listings --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round3-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
