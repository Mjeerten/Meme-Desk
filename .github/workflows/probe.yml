name: probe rpc
# Short test: does the free public Solana RPC stream pump.fun trades? (meme/rpc_probe.py)
on:
  workflow_dispatch:
    inputs:
      seconds:
        default: "180"
      url:
        default: "wss://api.mainnet-beta.solana.com"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet websockets
      - run: python -m meme.rpc_probe --seconds "${{ inputs.seconds }}" --url "${{ inputs.url }}"
