name: record pump.fun

# Records every pump.fun launch (PumpPortal free feed) and every bonding-curve trade (free public Solana RPC),
# meme/record.py. Two copies on different runners, because the public RPC drops every 10-30 s; the backtest merges
# them. The chain job starts the next run 2 min before this one ends (overlap is de-duplicated later).
# A 6-hourly watchdog restarts the chain if it broke.
# Stops chaining after RECORD_UNTIL. Data: artifact "pumpfun-<run id>" per run, kept 90 days.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes to record (under 60 = test run, does not chain)"
        default: "340"
  schedule:
    - cron: "41 */6 * * *"

env:
  RECORD_UNTIL: "2026-11-30"   # last day to record (UTC); change it to record longer
  MINUTES: ${{ inputs.minutes || '340' }}

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w record.yml -e workflow_dispatch -s in_progress --json databaseId -q length)
          queued=$(gh run list -R "$GITHUB_REPOSITORY" -w record.yml -e workflow_dispatch -s queued --json databaseId -q length)
          if [[ "$busy$queued" == "00" && "$(date -u +%F)" < "$RECORD_UNTIL" ]]; then gh workflow run record.yml -R "$GITHUB_REPOSITORY"; echo "chain restarted"; else echo "busy=$busy queued=$queued, nothing to do"; fi

  record:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - run: python -m pytest -q
      - name: record
        run: |
          if [[ "$(date -u +%F)" > "$RECORD_UNTIL" ]]; then echo "past RECORD_UNTIL"; exit 0; fi
          python -m meme.record --minutes "$MINUTES" --copy ${{ matrix.copy }}
      - run: python -m meme.stats data || true
      - uses: actions/upload-artifact@v4
        with:
          name: pumpfun-${{ github.run_id }}-${{ matrix.copy }}
          path: data/
          retention-days: 90
          compression-level: 0
          if-no-files-found: ignore

  chain:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (( MINUTES < 60 )); then echo "test run, not chaining"; exit 0; fi
          sleep $(( MINUTES * 60 - 120 ))
          if [[ "$(date -u +%F)" < "$RECORD_UNTIL" ]]; then gh workflow run record.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"; echo "next run started"; else echo "past RECORD_UNTIL"; fi
