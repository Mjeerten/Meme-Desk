name: record pump.fun

# Records every pump.fun launch + its first hour of trades (meme/record.py) in back-to-back ~6 h runs.
# Each run queues the next one once its tests pass, so the next run begins the moment this one ends.
# The 6-hourly schedule is only a backup in case the chain breaks. Stops chaining after RECORD_UNTIL.
# Data: one artifact per run ("pumpfun-<start time>"), kept 90 days. Public repo = Actions minutes are free.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

env:
  RECORD_UNTIL: "2026-11-30"   # last day to record (UTC); change it to record longer

permissions:
  contents: read
  actions: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet websockets pandas pytest
      - run: python -m pytest -q
      - name: queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(date -u +%F)" < "$RECORD_UNTIL" ]]; then gh workflow run record.yml --ref "$GITHUB_REF_NAME"; echo "next run queued"; else echo "past RECORD_UNTIL, not chaining"; fi
      - name: record
        run: |
          if [[ "$(date -u +%F)" > "$RECORD_UNTIL" ]]; then echo "past RECORD_UNTIL"; exit 0; fi
          python -m meme.record --minutes 340
      - run: python -m meme.stats data/*.csv.gz || true
      - uses: actions/upload-artifact@v4
        with:
          name: pumpfun-${{ github.run_id }}
          path: data/
          retention-days: 90
          compression-level: 0   # files are already gzipped
          if-no-files-found: ignore
