name: funding carry backtest
# carry/funding.py: long spot + short perp, collect funding (Binance public history), tune 2020-23, holdout 2024+.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas numpy requests
      - run: python -m carry.funding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funding-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
