name: round 4 graduated coins
# meme/graduates.py: every recorded migration -> GeckoTerminal 5-min candles -> buy rules + liquidity providing.
on:
  workflow_dispatch:
    inputs:
      max_coins:
        description: "most recent migrations to fetch (GeckoTerminal ~10 coins/min)"
        default: "1500"
permissions:
  contents: read
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas numpy requests
      - name: download recordings (launch files only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w record.yml -s completed -L 200 --json databaseId -q '.[].databaseId'); do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -D "data/$id" -p "pumpfun-*" 2>/dev/null || true
          done
          find data -name "*-trades.csv.gz" -delete
          find data -name "*.csv.gz" | wc -l
      - run: python -m meme.graduates data --max "${{ inputs.max_coins }}" --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
